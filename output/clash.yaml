dns:
  enable: true
  ipv6: true
  use-hosts: true
  cache-algorithm: arc
  use-system-hosts: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/15
  fake-ip-range6: 2001:2::1/48
  fake-ip-filter:
    - rule-set:private
    - rule-set:fakeip_filter
    - rule-set:geolocation-cn
    - rule-set:googlefcm
  default-nameserver:
    - 114.114.114.114#DIRECT
    - tls://223.5.5.5#DIRECT
    - https://1.12.12.12/dns-query#DIRECT
  proxy-server-nameserver:
    - 114.114.114.114#DIRECT
    - tls://223.5.5.5#DIRECT
    - https://doh.pub/dns-query#DIRECT
  nameserver:
    - https://cloudflare-dns.com/dns-query#默认代理
    - https://dns.google/dns-query#默认代理
  nameserver-policy:
    rule-set:private: system
    rule-set:douyin:
      - system
      - 180.184.1.1
      - 180.184.2.2
    rule-set:cn:
      - 223.5.5.5#DIRECT
      - 119.29.29.29#DIRECT
  direct-nameserver:
    - 223.5.5.5#DIRECT
    - 119.29.29.29#DIRECT
  direct-nameserver-follow-policy: true
hosts:
  doh.pub:
    - 1.12.12.12
    - 120.53.53.53
  cloudflare-dns.com:
    - 1.1.1.1
    - 1.0.0.1
  dns.google:
    - 8.8.8.8
    - 8.8.4.4
  services.googleapis.cn: services.googleapis.com
  +.mcdn.bilivideo.com:
    - 0.0.0.0
  +.mcdn.bilivideo.cn:
    - 0.0.0.0
  +.edge.mountaintoys.cn:
    - 0.0.0.0
  +.h2.smtcdns.net:
    - 0.0.0.0
mixed-port: 7890
allow-lan: true
ipv6: true
mode: rule
log-level: info
bind-address: '*'
unified-delay: true
tcp-concurrent: true
keep-alive-interval: 60
find-process-mode: strict
external-controller: 127.0.0.1:9090
external-ui: ui
external-ui-url: https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip
profile:
  store-selected: true
  store-fake-ip: true
ntp:
  enable: true
  write-to-system: false
  server: ntp.aliyun.com
  port: 123
  interval: 60
tun:
  enable: true
  stack: mips
  auto-route: true
  strict-route: true
  auto-redirect: true
  auto-detect-interface: true
  dns-hijack:
    - any:53
    - tcp://any:53
