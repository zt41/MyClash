name: Generate Clash Config

on:
  schedule:
    # 每 6 小时自动运行一次
    - cron: '0 */6 * * *'
  # 允许在 Actions 页面手动触发
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install js-yaml

      - name: 运行覆写脚本生成最终配置
        env:
          SUB_URL: ${{ secrets.CXY }}
        run: node Script/generate.js

      - name: 提交结果到仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/clash.yaml
          if git diff --cached --quiet; then
            echo "配置无变化，跳过提交"
          else
            git commit -m "chore: 自动更新订阅配置 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: 更新 latest 标签并刷新 CDN 缓存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 把 latest 标签强制移到当前 HEAD（最新提交）
          git tag -f latest
          git push -f origin latest
          # jsDelivr 对分支/标签有版本解析缓存，尽量主动 purge 触发刷新
          for ref in main latest; do
            curl -s -o /dev/null --max-time 20 "https://purge.jsdelivr.net/gh/zt41/MyClash@${ref}/output/clash.yaml" || true
          done
          echo "latest 标签已更新，已触发 CDN 刷新"
