name: Generate Clash Config

on:
  schedule:
    # 每 6 小时自动运行一次
    - cron: '0 */6 * * *'
  # 允许在 Actions 页面手动触发
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install js-yaml

      - name: 运行覆写脚本生成最终配置
        env:
          SUB_URL: ${{ secrets.SUB_URL }}
        run: node Script/generate.js

      - name: 提交结果到仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/clash.yaml
          if git diff --cached --quiet; then
            echo "配置无变化，跳过提交"
          else
            git commit -m "chore: 自动更新订阅配置 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
